    <style>
        html {
            background-color: #111;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 5%;
            min-width: 100px;
            height: 25px;
            /* Specified height */
            border: #00ff00, solid, 1px;
            /* Remove outline */
            background: #111;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            /* Override default look */
            appearance: none;
            width: 25px;
            /* Set a specific slider handle width */
            height: 25px;
            /* Slider handle height */
            background: #00ff00;
            /* Green background */
            cursor: pointer;
            /* Cursor on hover */
        }

        .cover {
            height: 30vh;
            width: auto;
        }

        .currentTime {
            display: inline-block;
            margin-right: 10px;
        }

        .duration {
            display: inline-block;
            margin-left: 10px;
        }

        input[type=file] {
            padding-top: 1vh;
        }

        button {
            border-radius: 0px;
            font-family: 'Courier New', Courier, monospace;
            background-color: #111;
            border-color: #00ff00;
            color: #00ff00;
            margin: 5px;
        }

        button:hover {
            background: #444;
        }

        input[type=text] {
            margin-top: 1vh;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            background-color: #111;
            border-color: #00ff00;
            color: #00ff00;
        }

        input[type=text]::placeholder {
            color: #00ff00;
        }

        input[type=file]::-webkit-file-upload-button {
            font-family: 'Courier New', Courier, monospace;
            background-color: #111;
            border-color: #00ff00;
            color: #00ff00;
        }

        h1 {
            font-size: medium;
        }

        progress[value] {
            background-color: #eee;
            border-radius: 2px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25) inset;
            text-align: left;
            border-style: solid;
            border-color: #333;
            border-width: 1px;
        }

        progress[value]::-webkit-progress-value {
            background: #00ff00;
            border-radius: 2px;
            background-size: 35px 20px, 100% 100%, 100% 100%;
        }
    </style>
</head>

                    </h4>

    <script>
        let i = 0, volume = 1, playbackRate = 1, shuffle = false;
        let audioCtx, sourceNode, audioBuffer;

        const progress = document.querySelector("progress");
        const songIndexLabel = document.querySelector("#songIndex");
        const songDuration = document.querySelector(".duration");
        const songCurrentTime = document.querySelector(".currentTime");
        const playButton = document.querySelector("#play");
        const uploadInput = document.getElementById("upload");

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        async function playMusic() {
            initAudio();
            const musicFiles = uploadInput.files;
            if (!musicFiles.length) return;

            if (audioCtx.state === 'suspended') await audioCtx.resume();

            if (sourceNode) {
                sourceNode.stop();
                sourceNode.disconnect();
            }

            const file = musicFiles[i];
            const arrayBuffer = await file.arrayBuffer();
    
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    
            startPlayback();
        }

        function startPlayback() {
            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;
    
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = volume;
    
            sourceNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);
    
            sourceNode.playbackRate.value = playbackRate;
            sourceNode.loop = true; 
    
            sourceNode.start(0);
            playButton.innerHTML = '||';
    
            updateUI();
        }

        function musicScroll(nextOrBack) {
            const musicFiles = uploadInput.files;
            if (!musicFiles.length) return;

            if (shuffle) {
                i = Math.floor(Math.random() * musicFiles.length);
            } else {
                if (nextOrBack === "next") {
                    i = (i + 1) % musicFiles.length;
                } else {
                    i = (i - 1 + musicFiles.length) % musicFiles.length;
                }
            }
            playMusic();
        }

        function togglePlay() {
            if (!audioCtx) return playMusic();
            
            if (audioCtx.state === 'running') {
                audioCtx.suspend();
                playButton.innerText = '>';
            } else {
                audioCtx.resume();
                playButton.innerHTML = '||';
            }
        }
        
        function updateUI() {
            if (audioCtx && audioCtx.state === 'running' && audioBuffer) {
                const currTime = audioCtx.currentTime % audioBuffer.duration;
                const totalTime = audioBuffer.duration;

                progress.value = currTime;
                progress.max = totalTime;
        
                songCurrentTime.innerText = Math.floor(currTime);
                songDuration.innerText = Math.floor(totalTime);
                songIndexLabel.innerText = `this.songIndex == ${i}`;
            }
            requestAnimationFrame(updateUI);
        }
    </script>
