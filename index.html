<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lastie Music Player</title>
    <meta name="title" content="Winter's Awakening">
    <meta property="og:description" content="Maybe music is the answer..?">
    <style>
        :root {
            --black: #0a0b10;
            --grey-dark: #14161c;
            --white: #e0f2f1;
            --accent: #4a5568;
            --portal-blue: #b3e5fc;
            --flicker-orange: rgba(255, 140, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100dvh;
            background-color: #000;
            color: var(--white);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body::before {
            content: "";
            display: block;
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
                radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.9) 120%);
            z-index: 1000;
            background-size: 100% 0.375rem, 100% 100%;
            pointer-events: none;
            animation: crt-scroll 0.5s linear infinite;
        }

        #homepage {
            width: 96vw;
            height: 94dvh;
            background: radial-gradient(circle at center, #1c1f26 0%, #0a0b10 100%);
            border-radius: 2.5rem;
            border: 0.9375rem solid #050505;
            transform: perspective(62.5rem) rotateX(1deg) scale(1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.25rem;
            animation: bulbFlicker 10s infinite;
        }

        .cover {
            display: none;
            height: 25vh;
            width: auto;
            margin-bottom: 1.25rem;
        }

        .player-controls {
            width: 85%;
            max-width: 43.75rem;
            background: var(--grey-dark);
            border: 0.0625rem solid var(--accent);
            padding: 1.5625rem;
            text-align: center;
        }

        button {
            background: transparent;
            color: var(--white);
            border: 0.0625rem solid var(--accent);
            padding: 0.625rem 1.25rem;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            margin: 0.3125rem;
            text-transform: uppercase;
        }

        button:hover {
            background: var(--white);
            color: var(--black);
        }

        progress {
            width: 100%;
            height: 0.5rem;
            appearance: none;
            margin: 0.9375rem 0;
            background: var(--black);
        }

        progress::-webkit-progress-bar { background: var(--black); border: 0.0625rem solid var(--accent); }
        progress::-webkit-progress-value { background: var(--portal-blue); }
        progress::-moz-progress-bar { background: var(--portal-blue); }

        input[type=number], input[type=file] {
            background: var(--black);
            border: 0.0625rem solid var(--accent);
            color: var(--white);
            padding: 0.5rem;
            font-family: inherit;
            margin: 0.3125rem 0;
            width: 100%;
        }

        .slider {
            width: 100%;
            height: 0.3125rem;
            background: var(--accent);
            appearance: none;
            outline: none;
            margin: 0.9375rem 0;
        }

        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 0.9375rem;
            height: 0.9375rem;
            background: var(--portal-blue);
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            appearance: none;
            width: 0.9375rem;
            height: 0.9375rem;
            background: var(--portal-blue);
            cursor: pointer;
        }

        .status-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--portal-blue);
            margin-bottom: 0.625rem;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.9375rem;
            margin: 0.9375rem 0;
            font-size: 0.9rem;
        }

        .title {
            margin-bottom: 1rem;
        }

        @keyframes bulbFlicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { filter: brightness(1); }
            20%, 24%, 55% { filter: brightness(1.1) contrast(1.1); }
            21%, 56% { filter: brightness(0.9); }
        }

        @keyframes crt-scroll {
            from { background-position: 0 0; }
            to { background-position: 0 0.375rem; }
        }

        @supports (-moz-appearance: none) {
            #homepage {
                transform: none;  
                filter: blur(.3px);
            }
        }
    </style>
</head>
<body>

    <div id="homepage">
        <h1 class="title">AUDIO_PLAYBACK</h1>
        
        <img draggable="false" class="cover" id="albumArt" alt="Album art">
        
        <div class="player-controls">
            <audio id="music" onended="onTrackEnded()"></audio>

            <div class="status-labels">
                <span class="currentTime">0:00</span>
                <span id="songIndex">IDLE</span>
                <span class="duration">0:00</span>
            </div>

            <progress id="progressBar" value="0" max="100"></progress>

            <div class="nav-btns">
                <button onclick="musicScroll('back')">PREV</button>
                <button id="play" onclick="togglePlay()">PLAY</button>
                <button onclick="musicScroll('next')">NEXT</button>
            </div>

            <div class="checkbox-group">
                <label>LOOP <input type="checkbox" onchange="isLooping = this.checked"></label>
                <label>PITCH <input type="checkbox" onchange="musicPlayer.preservesPitch = this.checked" checked></label>
                <label>SHUFFLE <input type="checkbox" onchange="shuffle = this.checked"></label>
            </div>

            <div class="divider"></div>

            <input type="number" placeholder="CURRENT_TIME" onchange="seekAudio(this.value)">
            <input type="number" step="0.1" placeholder="PLAYBACK_RATE" onchange="updateRate(this.value)">
            
            <p style="margin-top:0.9375rem; font-size: 0.7rem; letter-spacing:0.125rem;">OUTPUT_VOLUME</p>
            
            <input class="slider" type="range" value="1" min="0" max="1" step=".01" oninput="updateVolume(this.value)">
            
            <input type="file" id="upload" multiple accept="audio/*" onchange="i=0; playMusic();">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
    <script>
        let i = 0, volume = 1, playbackRate = 1, shuffle = false, isLooping = false;
        let albumArtUrl = null, albumArtRequest = 0;
        const musicPlayer = document.getElementById("music");
        const uploadInput = document.getElementById("upload");
        const playButton = document.getElementById("play");
        const songIndexLabel = document.getElementById("songIndex");
        const albumArt = document.getElementById("albumArt");

        function hideAlbumArt() {
            albumArt.style.display = "none";
            albumArt.removeAttribute("src");
            if (albumArtUrl) {
                URL.revokeObjectURL(albumArtUrl);
                albumArtUrl = null;
            }
        }

        function loadAlbumArt(file) {
            const request = ++albumArtRequest;
            hideAlbumArt();

            if (!window.jsmediatags) {
                console.error("Album art reader failed to load.");
                return;
            }

            window.jsmediatags.read(file, {
                onSuccess: ({ tags }) => {
                    if (request !== albumArtRequest) return;
                    const picture = tags.picture;
                    if (!picture || !picture.data.length) return;
                    if (!/^image\/(?:jpeg|png|gif|webp)$/i.test(picture.format)) {
                        console.warn(`Unsupported album art format: ${picture.format}`);
                        return;
                    }

                    albumArtUrl = URL.createObjectURL(new Blob(
                        [new Uint8Array(picture.data)],
                        { type: picture.format }
                    ));
                    const imageUrl = albumArtUrl;
                    albumArt.onload = () => {
                        if (request === albumArtRequest && imageUrl === albumArtUrl) {
                            albumArt.style.display = "block";
                        }
                    };
                    albumArt.onerror = () => {
                        if (request === albumArtRequest && imageUrl === albumArtUrl) {
                            console.warn("Could not display the embedded album art.");
                            hideAlbumArt();
                        }
                    };
                    albumArt.src = imageUrl;
                },
                onError: error => {
                    if (request === albumArtRequest) {
                        console.warn("Could not read embedded album art:", error);
                    }
                }
            });
        }

        async function playMusic() {
            const files = uploadInput.files;
            if (!files.length || !files[i]) return;

            loadAlbumArt(files[i]);
            if (musicPlayer.src) URL.revokeObjectURL(musicPlayer.src);
            musicPlayer.src = URL.createObjectURL(files[i]);
            musicPlayer.volume = volume;
            musicPlayer.playbackRate = playbackRate;
            musicPlayer.loop = isLooping;

            musicPlayer.play().then(() => {
                playButton.innerHTML = 'PAUSE';
            }).catch(e => console.log("Interaction required!"));
            
            songIndexLabel.innerText = `SRC_INDEX: ${i}`;
        }

        function onTrackEnded() {
            if (!isLooping) musicScroll('next');
        }

        function musicScroll(direction) {
            const files = uploadInput.files;
            if (!files.length) return;
            if (shuffle) {
                i = Math.floor(Math.random() * files.length);
            } else {
                i = (direction === 'next') ? (i + 1) % files.length : (i - 1 + files.length) % files.length;
            }
            playMusic();
        }

        function togglePlay() {
            if (musicPlayer.paused) {
                musicPlayer.play();
                playButton.innerHTML = 'PAUSE';
            } else {
                musicPlayer.pause();
                playButton.innerText = 'PLAY';
            }
        }

        function updateVolume(val) { volume = val; musicPlayer.volume = val; }
        function updateRate(val) { playbackRate = val; musicPlayer.playbackRate = val; }
        function seekAudio(val) { musicPlayer.currentTime = val; }

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function updateUI() {
            const progress = document.getElementById("progressBar");
            if (musicPlayer.duration) {
                progress.value = musicPlayer.currentTime;
                progress.max = musicPlayer.duration;
                document.querySelector(".currentTime").innerText = formatTime(musicPlayer.currentTime);
                document.querySelector(".duration").innerText = formatTime(musicPlayer.duration);
            }
            requestAnimationFrame(updateUI);
        }
        requestAnimationFrame(updateUI);
    </script>
</body>
</html>
