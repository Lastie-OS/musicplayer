<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lastie Music Player | Terminal</title>
    <meta name="title" content="Winter's Awakening">
    <meta property="og:description" content="Maybe music is the answer..?">
    <style>
        :root {
            --black: #0a0b10;
            --grey-dark: #14161c;
            --white: #e0f2f1;
            --accent: #4a5568;
            --portal-blue: #b3e5fc;
            --ice-glow: rgba(179, 229, 252, 0.15);
            --flicker-orange: rgba(255, 140, 0, 0.15);
            --warm-glow: rgba(255, 180, 50, 0.1);
        }

        @font-face {
            font-family: 'aaalex-ui';
            src: url('fonts/aaalex-ui.ttf') format('truetype');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100dvh;
            background-color: #000;
            color: var(--white);
            font-family: 'aaalex-ui', 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CRT Overlay Effect */
        body::before {
            content: "";
            display: block;
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
                radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.9) 120%);
            z-index: 1000;
            background-size: 100% 6px, 100% 100%;
            pointer-events: none;
            animation: crt-scroll 0.5s linear infinite;
        }

        #homepage {
            width: 96vw;
            height: 94dvh;
            background: radial-gradient(circle at center, #1c1f26 0%, #0a0b10 100%);
            border-radius: 40px;
            border: 15px solid #050505;
            box-shadow: inset 0 0 80px rgba(179, 229, 252, 0.05);
            transform: perspective(1000px) rotateX(1deg) scale(1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            animation: bulbFlicker 10s infinite;
        }

        .cover {
            height: 25vh;
            width: auto;
            border: 1px solid var(--accent);
            box-shadow: 0 0 20px var(--ice-glow);
            margin-bottom: 20px;
        }

        .player-controls {
            width: 85%;
            max-width: 700px;
            background: var(--grey-dark);
            border: 1px solid var(--accent);
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        button {
            background: transparent;
            color: var(--white);
            border: 1px solid var(--accent);
            padding: 10px 20px;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            margin: 5px;
            text-transform: uppercase;
        }

        button:hover {
            background: var(--white);
            color: var(--black);
            box-shadow: 0 0 15px var(--ice-glow);
        }

        progress {
            width: 100%;
            height: 8px;
            appearance: none;
            margin: 15px 0;
        }

        progress::-webkit-progress-bar { background: var(--black); border: 1px solid var(--accent); }
        progress::-webkit-progress-value { background: var(--portal-blue); box-shadow: 0 0 10px var(--portal-blue); }

        input[type=number], input[type=file] {
            background: var(--black);
            border: 1px solid var(--accent);
            color: var(--white);
            padding: 8px;
            font-family: inherit;
            margin: 5px 0;
            width: 100%;
        }

        .slider {
            width: 100%;
            height: 5px;
            background: var(--accent);
            appearance: none;
            outline: none;
            margin: 15px 0;
        }

        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 15px;
            height: 15px;
            background: var(--portal-blue);
            cursor: pointer;
            box-shadow: 0 0 10px var(--portal-blue);
        }

        .status-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--portal-blue);
            margin-bottom: 10px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            font-size: 0.9rem;
        }

        @keyframes bulbFlicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { filter: brightness(1); }
            20%, 24%, 55% { filter: brightness(1.1) contrast(1.1); }
            21%, 56% { filter: brightness(0.9); }
        }

        @keyframes crt-scroll {
            from { background-position: 0 0; }
            to { background-position: 0 6px; }
        }
    </style>
</head>
<body>

    <div id="homepage">
        <h1 class="title">AUDIO_LINK.v3</h1>
        
        <img draggable="false" class="cover" id="albumArt" src="">
        
        <div class="player-controls">
            <audio id="music" onended="onTrackEnded()"></audio>

            <div class="status-labels">
                <span class="currentTime">0:00</span>
                <span id="songIndex">IDLE</span>
                <span class="duration">0:00</span>
            </div>

            <progress id="progressBar" value="0" max="100"></progress>

            <div class="nav-btns">
                <button onclick="musicScroll('back')">PREV</button>
                <button id="play" onclick="togglePlay()">PLAY</button>
                <button onclick="musicScroll('next')">NEXT</button>
            </div>

            <div class="checkbox-group">
                <label>LOOP <input type="checkbox" onchange="isLooping = this.checked"></label>
                <label>PITCH <input type="checkbox" onchange="musicPlayer.preservesPitch = this.checked" checked></label>
                <label>SHUFFLE <input type="checkbox" onchange="shuffle = this.checked"></label>
            </div>

            <div class="divider"></div>

            <input type="number" placeholder="SEEK_TO_SECONDS" onchange="seekAudio(this.value)">
            <input type="number" step="0.1" placeholder="PLAYBACK_RATE" onchange="updateRate(this.value)">
            
            <p style="margin-top:15px; font-size: 0.7rem; letter-spacing: 2px;">OUTPUT_VOLUME</p>
            <input class="slider" type="range" value="1" min="0" max="1" step=".01" oninput="updateVolume(this.value)">
            
            <input type="file" id="upload" multiple accept="audio/*" onchange="i=0; playMusic();">
        </div>
    </div>

    <script>
        let i = 0, volume = 1, playbackRate = 1, shuffle = false, isLooping = false;
        const musicPlayer = document.getElementById("music");
        const uploadInput = document.getElementById("upload");
        const playButton = document.getElementById("play");
        const songIndexLabel = document.getElementById("songIndex");

        async function playMusic() {
            const files = uploadInput.files;
            if (!files.length || !files[i]) return;

            if (musicPlayer.src) URL.revokeObjectURL(musicPlayer.src);
            musicPlayer.src = URL.createObjectURL(files[i]);
            musicPlayer.volume = volume;
            musicPlayer.playbackRate = playbackRate;
            musicPlayer.loop = isLooping;

            musicPlayer.play().then(() => {
                playButton.innerHTML = 'PAUSE';
            }).catch(e => console.log("System Idle: Interaction Required"));
            
            songIndexLabel.innerText = `SRC_INDEX: ${i}`;
        }

        function onTrackEnded() {
            if (!isLooping) musicScroll('next');
        }

        function musicScroll(direction) {
            const files = uploadInput.files;
            if (!files.length) return;
            if (shuffle) {
                i = Math.floor(Math.random() * files.length);
            } else {
                i = (direction === 'next') ? (i + 1) % files.length : (i - 1 + files.length) % files.length;
            }
            playMusic();
        }

        function togglePlay() {
            if (musicPlayer.paused) {
                musicPlayer.play();
                playButton.innerHTML = 'PAUSE';
            } else {
                musicPlayer.pause();
                playButton.innerText = 'PLAY';
            }
        }

        function updateVolume(val) { volume = val; musicPlayer.volume = val; }
        function updateRate(val) { playbackRate = val; musicPlayer.playbackRate = val; }
        function seekAudio(val) { musicPlayer.currentTime = val; }

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function updateUI() {
            const progress = document.getElementById("progressBar");
            if (musicPlayer.duration) {
                progress.value = musicPlayer.currentTime;
                progress.max = musicPlayer.duration;
                document.querySelector(".currentTime").innerText = formatTime(musicPlayer.currentTime);
                document.querySelector(".duration").innerText = formatTime(musicPlayer.duration);
            }
            requestAnimationFrame(updateUI);
        }
        requestAnimationFrame(updateUI);
    </script>
</body>
</html>
